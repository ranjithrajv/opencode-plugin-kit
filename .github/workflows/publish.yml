name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). npm mints a short-lived
      # token from this job's identity, so there is no long-lived secret to
      # store, rotate or leak. See the "Trusted publishing" note below.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No NODE_AUTH_TOKEN: `npm publish` authenticates via the OIDC
          # identity token that setup-node exchanges for a short-lived
          # registry token.

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          # setup-node above owns the Node version and the registry auth that
          # `npm publish` needs; keep it and only borrow the `vp` binary.
          #
          # `package-manager` is deliberately NOT set. setup-vp rejects the
          # input outright unless Vite+ >= 0.3.1, and this repo pins 0.1.x —
          # passing `package-manager: false` failed the whole job before any
          # step ran. Leaving it unset matches ci.yml, which works; `npm` here
          # is still the runner's own.
          node-manager: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (format, lint, types)
        run: vp check

      - name: Test with coverage
        run: vp exec vitest run --coverage

      - uses: oven-sh/setup-bun@v2

      - name: Build reactive dist
        run: bun build.ts

      # Release gate: the published package must pass the type tripwire AND the
      # runtime smoke against every supported host build. Runs before publish so
      # a broken release cannot leave the runner.
      - name: Host compatibility gate
        run: node scripts/check-host-compat.mjs

      # A release published by hand, or a re-run of an older tag, must not turn
      # into a red build. Skip the upload when this exact version is already on
      # the registry, so the rest of the gate still runs and reports.
      #
      # `npm view` needs no auth, so this probe works even when the OIDC
      # exchange further down would fail.
      - name: Check whether this version is already published
        id: already-published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.already-published.outputs.exists == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with dist-tag: $TAG"
          npm publish --tag "$TAG"
