name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          # setup-node above owns the Node version and the registry auth that
          # `npm publish` needs; keep it and only borrow the `vp` binary.
          #
          # `package-manager` is deliberately NOT set. setup-vp rejects the
          # input outright unless Vite+ >= 0.3.1, and this repo pins 0.1.x —
          # passing `package-manager: false` failed the whole job before any
          # step ran. Leaving it unset matches ci.yml, which works; `npm` here
          # is still the runner's own, and auth comes from setup-node's .npmrc.
          node-manager: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (format, lint, types)
        run: vp check

      - name: Test with coverage
        run: vp exec vitest run --coverage

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with dist-tag: $TAG"
          npm publish --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
